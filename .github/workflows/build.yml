name: Build Windows application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.414
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Show tool versions
        shell: pwsh
        run: |
          dotnet --info
          msbuild -version
      - name: Restore
        shell: pwsh
        run: >
          msbuild RobloxAccountManager.sln
          /t:Restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:RestoreForce=true
      - name: Build
        shell: pwsh
        run: >
          msbuild RobloxAccountManager.sln
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:Restore=false
      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/RobloxAccountManager.Tests/RobloxAccountManager.Tests.csproj
          --configuration Release
          --no-build
          -p:Platform=x64
      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/RobloxAccountManager/RobloxAccountManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath RobloxAccountManager-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxAccountManager-Windows-x64
          path: RobloxAccountManager-Windows-x64.zip
