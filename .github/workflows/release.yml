name: Release Windows application

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.414
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Show tool versions
        shell: pwsh
        run: |
          dotnet --info
          msbuild -version
      - name: Restore
        shell: pwsh
        run: >
          msbuild RobloxAccountManager.sln
          /t:Restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:RestoreForce=true
      - name: Build
        shell: pwsh
        run: >
          msbuild RobloxAccountManager.sln
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:Restore=false
      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/RobloxAccountManager.Tests/RobloxAccountManager.Tests.csproj
          --configuration Release
          --no-build
          -p:Platform=x64
      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/RobloxAccountManager/RobloxAccountManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          --output artifacts/publish
          -p:Platform=x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath RobloxAccountManager-Windows-x64.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: RobloxAccountManager-Windows-x64.zip
          generate_release_notes: true
